<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Houska Family Recipe Book</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf6f0;
  --parchment: #f2ead8;
  --parchment-dark: #e8dcc4;
  --ink: #1c1410;
  --ink-light: #4a3728;
  --rust: #b84c2b;
  --rust-light: #d4613d;
  --gold: #c4973a;
  --gold-light: #e8c06a;
  --sage: #5c7a5c;
  --card-bg: #fff9f2;
  --border: #ddd3be;
  --border-dark: #c8b89a;
  --shadow: rgba(28,20,16,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: #2a1f14;
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 4rem;
}

/* ── BOOK SHELL ─────────────────────────────────────────────── */
.book {
  width: 100%;
  max-width: 860px;
  background: var(--cream);
  border-radius: 4px 12px 12px 4px;
  box-shadow:
    -6px 0 0 #1a110a,
    0 0 0 1px #1a110a,
    8px 8px 40px rgba(0,0,0,0.6),
    inset -3px 0 8px rgba(0,0,0,0.06);
  position: relative;
  overflow: hidden;
}

/* spine */
.book::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 18px;
  background: linear-gradient(to right, #1a110a, #2d1f12 40%, #3d2a18 100%);
  z-index: 10;
}

/* page-turn shadow */
.book::after {
  content: '';
  position: absolute;
  left: 18px; top: 0; bottom: 0;
  width: 24px;
  background: linear-gradient(to right, rgba(0,0,0,0.1), transparent);
  pointer-events: none;
  z-index: 9;
}

/* ── COVER ──────────────────────────────────────────────────── */
.cover {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 420px;
  padding: 4rem 3rem 3rem;
  background: var(--ink);
  position: relative;
  text-align: center;
}

.cover-border {
  position: absolute;
  inset: 1.5rem;
  border: 1px solid rgba(196,151,58,0.3);
  pointer-events: none;
}
.cover-border::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(196,151,58,0.15);
}

.cover-eyebrow {
  font-size: 0.65rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1.75rem;
  font-weight: 500;
}

.cover h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  line-height: 1.05;
  color: var(--cream);
}

.cover h1 .line1 {
  display: block;
  font-size: clamp(2rem, 5vw, 3.2rem);
}

.cover h1 .line2 {
  display: block;
  font-size: clamp(1.5rem, 4vw, 2.4rem);
  font-style: italic;
  color: var(--gold-light);
  margin-top: 0.2rem;
}

.cover-divider {
  width: 80px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
  margin: 2rem auto;
}

.cover-sub {
  font-size: 0.8rem;
  color: rgba(250,246,240,0.45);
  letter-spacing: 0.1em;
  font-style: italic;
}

/* ── CONTROLS BAR ───────────────────────────────────────────── */
.controls {
  background: var(--parchment);
  border-bottom: 1px solid var(--border-dark);
  padding: 0.85rem 1.75rem 0.85rem 2.5rem;
  display: flex;
  gap: 0.6rem;
  align-items: center;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 50;
}

.search-wrap {
  flex: 1;
  min-width: 160px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  padding: 0.5rem 0.75rem 0.5rem 2rem;
  border: 1px solid var(--border-dark);
  border-radius: 5px;
  background: var(--card-bg);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--rust); }
.search-icon {
  position: absolute;
  left: 0.6rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-light);
  opacity: 0.35;
  font-size: 0.8rem;
}

.diet-toggle {
  display: flex;
  gap: 0.3rem;
  padding: 0.2rem;
  background: var(--border);
  border-radius: 20px;
}
.diet-btn {
  padding: 0.3rem 0.8rem;
  border: none;
  border-radius: 16px;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--ink-light);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.04em;
}
.diet-btn.active { background: var(--sage); color: white; }

/* ── TABLE OF CONTENTS ──────────────────────────────────────── */
.toc {
  padding: 3rem 2.5rem 3rem 3.5rem;
}

.toc-header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}

.toc-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: 0.05em;
}

.toc-header p {
  font-size: 0.75rem;
  color: var(--ink-light);
  opacity: 0.6;
  margin-top: 0.4rem;
  font-style: italic;
}

.toc-section {
  margin-bottom: 2rem;
}

.toc-section-title {
  font-family: 'Playfair Display', serif;
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.25em;
  color: var(--rust);
  margin-bottom: 0.1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}

.toc-subsection {
  margin-top: 1rem;
}

.toc-subsection-title {
  font-size: 0.62rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-light);
  opacity: 0.55;
  margin-bottom: 0.4rem;
  padding-left: 0.5rem;
  border-left: 2px solid var(--border);
}

.toc-entry {
  display: flex;
  align-items: baseline;
  gap: 0;
  padding: 0.38rem 0.5rem;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.15s;
  position: relative;
}
.toc-entry:hover { background: var(--parchment); }
.toc-entry.hidden { display: none; }

.toc-entry-name {
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  font-weight: 400;
  color: var(--ink);
  flex: 1;
  line-height: 1.3;
}

.toc-dots {
  flex: 1;
  border-bottom: 1px dotted var(--border-dark);
  margin: 0 0.5rem;
  min-width: 20px;
  position: relative;
  top: -3px;
}

.toc-meta {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-shrink: 0;
}

.toc-time {
  font-size: 0.7rem;
  color: var(--ink-light);
  opacity: 0.5;
}

.toc-badge {
  font-size: 0.55rem;
  font-weight: 500;
  padding: 0.1rem 0.35rem;
  border-radius: 2px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.toc-gf { background: rgba(92,122,92,0.12); color: var(--sage); }
.toc-df { background: rgba(196,151,58,0.12); color: var(--gold); }

.toc-entry-chef {
  font-size: 0.68rem;
  color: var(--ink-light);
  opacity: 0.45;
  font-style: italic;
  margin-left: 0.3rem;
}

/* ── RECIPE PAGE ────────────────────────────────────────────── */
.recipe-page {
  display: none;
  padding: 3rem 2.5rem 3.5rem 3.5rem;
  position: relative;
}
.recipe-page.active { display: block; }

.recipe-back {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  color: var(--ink-light);
  opacity: 0.55;
  cursor: pointer;
  margin-bottom: 2rem;
  transition: opacity 0.15s;
  width: fit-content;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.recipe-back:hover { opacity: 1; color: var(--rust); }

.recipe-header { margin-bottom: 2rem; }

.recipe-section-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.3em;
  color: var(--rust);
  font-weight: 500;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.recipe-section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.recipe-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 400;
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: 1rem;
}

.recipe-meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 1.25rem;
  align-items: center;
  padding: 0.85rem 1rem;
  background: var(--parchment);
  border-radius: 6px;
  margin-bottom: 0.75rem;
}

.recipe-meta-item {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.recipe-meta-label {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-light);
  opacity: 0.5;
}
.recipe-meta-value {
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  color: var(--ink);
}

.recipe-badges {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}
.recipe-badge {
  font-size: 0.62rem;
  font-weight: 500;
  padding: 0.2rem 0.6rem;
  border-radius: 3px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.badge-gf { background: rgba(92,122,92,0.12); color: var(--sage); }
.badge-df { background: rgba(196,151,58,0.12); color: var(--gold); }

.recipe-note {
  background: var(--parchment);
  border-left: 3px solid var(--gold);
  padding: 0.85rem 1.1rem;
  border-radius: 0 6px 6px 0;
  font-size: 0.82rem;
  font-style: italic;
  color: var(--ink-light);
  line-height: 1.65;
  margin-bottom: 1.75rem;
}

/* two-column layout for ingredients + instructions */
.recipe-body {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 2.5rem;
  align-items: start;
}

@media (max-width: 600px) {
  .recipe-body { grid-template-columns: 1fr; gap: 1.5rem; }
  .toc { padding: 2rem 1.25rem 2rem 2rem; }
  .recipe-page { padding: 2rem 1.25rem 2.5rem 2rem; }
  .controls { padding: 0.75rem 1rem 0.75rem 1.5rem; }
}

.recipe-col-title {
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 0.85rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.recipe-col-title::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 1em;
  background: var(--rust);
  border-radius: 2px;
  flex-shrink: 0;
}

/* serving adjuster */
.serving-adjuster {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
  font-size: 0.75rem;
  color: var(--ink-light);
}
.serving-label { opacity: 0.6; font-size: 0.72rem; }
.serving-btn {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid var(--border-dark);
  background: var(--card-bg);
  color: var(--ink);
  font-size: 0.9rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  line-height: 1;
}
.serving-btn:hover { border-color: var(--rust); color: var(--rust); }
#serving-count {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  color: var(--rust);
  min-width: 1.2rem;
  text-align: center;
}

.ingredient-group-title {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--rust);
  font-weight: 500;
  margin-top: 0.9rem;
  margin-bottom: 0.3rem;
  opacity: 0.8;
}

.ingredient-row {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  font-size: 0.82rem;
  padding: 0.28rem 0;
  border-bottom: 1px solid rgba(221,211,190,0.45);
  line-height: 1.4;
}
.ingredient-amount {
  font-weight: 500;
  color: var(--rust);
  min-width: 58px;
  font-size: 0.78rem;
  flex-shrink: 0;
}
.ingredient-name { color: var(--ink); flex: 1; }

.steps-list { display: grid; gap: 0.85rem; }

.step {
  display: flex;
  gap: 0.85rem;
  align-items: flex-start;
  font-size: 0.83rem;
  line-height: 1.7;
}
.step-num {
  background: var(--ink);
  color: var(--cream);
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem;
  font-weight: 500;
  flex-shrink: 0;
  margin-top: 0.15rem;
}
.step-content { flex: 1; }
.step-title {
  font-weight: 500;
  color: var(--ink);
  font-size: 0.78rem;
  margin-bottom: 0.15rem;
}
.step-text { color: var(--ink-light); }
.step-time {
  font-size: 0.68rem;
  color: var(--rust);
  opacity: 0.7;
  margin-top: 0.2rem;
  font-style: italic;
}
.step-tip {
  font-size: 0.72rem;
  color: var(--gold);
  opacity: 0.85;
  margin-top: 0.18rem;
  font-style: italic;
  line-height: 1.5;
}

.source-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: var(--rust);
  color: white;
  padding: 0.7rem 1.1rem;
  border-radius: 5px;
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  transition: background 0.15s;
  margin-top: 0.5rem;
}
.source-link:hover { background: var(--rust-light); }

.no-results {
  padding: 4rem 2rem;
  text-align: center;
  color: var(--ink-light);
  opacity: 0.5;
}
.no-results p:first-child {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem;
  margin-bottom: 0.4rem;
}

/* page footer */
.page-footer {
  padding: 1.25rem 2.5rem 1.25rem 3.5rem;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.65rem;
  color: var(--ink-light);
  opacity: 0.4;
  letter-spacing: 0.08em;
}
</style>
</head>
<body>

<div class="book">

  <!-- COVER -->
  <div class="cover">
    <div class="cover-border"></div>
    <h1>
      <span class="line1">Houska Family</span>
      <span class="line2">Recipe Book</span>
    </h1>
    <div class="cover-divider"></div>
    <div class="cover-sub">The best of family recipes&hellip; and the internet.</div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search" placeholder="Search recipes&hellip;" oninput="filterTOC()">
    </div>
    <div class="diet-toggle">
      <button class="diet-btn" id="btn-gf" onclick="toggleDiet('gf')">GF</button>
      <button class="diet-btn" id="btn-df" onclick="toggleDiet('df')">DF</button>
    </div>
  </div>

  <!-- TABLE OF CONTENTS -->
  <div class="toc" id="toc">
    <div class="toc-header">
      <h2>Table of Contents</h2>
      <p>Click any recipe to open it</p>
    </div>
    <div id="toc-body"></div>
    <div class="no-results" id="no-results" style="display:none">
      <p>No recipes found</p>
      <p>Try a different search or filter</p>
    </div>
  </div>

  <!-- RECIPE PAGE (hidden until a recipe is opened) -->
  <div class="recipe-page" id="recipe-page">
    <div class="recipe-back" onclick="closePage()">← Table of Contents</div>
    <div class="recipe-header">
      <div class="recipe-section-label" id="r-section"></div>
      <h2 class="recipe-title" id="r-title"></h2>
      <div class="recipe-meta-row" id="r-meta"></div>
      <div class="recipe-badges" id="r-badges" style="margin-bottom:0.75rem"></div>
    </div>
    <div class="recipe-note" id="r-note" style="display:none"></div>
    <div class="recipe-body" id="r-body"></div>
  </div>

  <div class="page-footer">
    <span>Houska Family Recipe Book</span>
    <span id="footer-count"></span>
  </div>

</div><!-- /book -->

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8h2NVT0qZHt7jxJJpL8p1mcAzJrQyDGSY6H6hh4ja3OLp23t8tTV38RYDkNkvxD00Z9cKaJVIzSRA/pub?output=csv';

// ─── STRUCTURE ────────────────────────────────────────────────────────────────
const SECTIONS = [
  { key: 'beef',     label: 'Beef',          parent: 'Mains' },
  { key: 'chicken',  label: 'Chicken',       parent: 'Mains' },
  { key: 'fish',     label: 'Fish & Seafood',parent: 'Mains' },
  { key: 'seafood',  label: 'Fish & Seafood',parent: 'Mains' },
  { key: 'sides',    label: 'Sides & Salads',parent: 'Sides & Salads' },
  { key: 'desserts', label: 'Desserts',      parent: 'Desserts' },
];

// ─── FULL RECIPES ─────────────────────────────────────────────────────────────
const WRITTEN = {

  // ── BEEF ──────────────────────────────────────────────────────────────────

  "filet mignon with mushroom red wine sauce": {
    id: "filet-mignon", section: "beef", servings: 4,
    ingredients: [
      { group: "Steaks", items: [
        { amount: "4 (6oz)", name: "Filet mignon, about 1½ inches thick" },
        { amount: "to taste", name: "Kosher salt & black pepper" },
      ]},
      { group: "Mushroom Wine Sauce", items: [
        { amount: "16 oz", name: "Baby bella mushrooms, thickly sliced" },
        { amount: "1 small", name: "Yellow onion, finely diced" },
        { amount: "4 cloves", name: "Garlic, minced" },
        { amount: "1 Tbsp", name: "Fresh thyme, minced (or 1 tsp dried)" },
        { amount: "½ cup", name: "Dry red wine — Merlot or Cabernet" },
        { amount: "1½ cups", name: "Low-sodium beef broth" },
        { amount: "½ cup", name: "Heavy cream" },
        { amount: "4 Tbsp", name: "Unsalted butter, divided" },
        { amount: "2 Tbsp", name: "Olive oil, divided" },
        { amount: "to taste", name: "Salt & pepper" },
      ]},
    ],
    steps: [
      { num: 1, title: "Build the mushroom base", text: "Melt 2 Tbsp butter with 1 Tbsp olive oil in a large heavy skillet over medium-high. Add mushrooms in a single layer — resist stirring for 3 minutes so they brown rather than steam. Add onion and cook 3 more minutes. Press in garlic, add thyme, season with salt and pepper, and cook 2 minutes until fragrant. Transfer to a plate.", time: "10 min" },
      { num: 2, title: "Sear the steaks", text: "Wipe the skillet clean. Pat steaks completely dry — moisture is the enemy of a good sear. Season generously on all sides. Add remaining butter and oil over medium-high. When butter foam subsides, add steaks. Sear 3–5 min per side for medium-rare (125°F). Transfer to a plate and tent loosely with foil.", time: "6–10 min" },
      { num: 3, title: "Build the sauce", text: "In the same skillet over medium-high, pour in wine. Scrape every browned bit from the bottom — that's flavor. Simmer until reduced by half, about 3 minutes. Add beef broth and boil until roughly ⅔ cup of liquid remains, 5–7 minutes.", time: "8–10 min" },
      { num: 4, title: "Finish & serve", text: "Stir in cream and boil 2 minutes until slightly thickened. Season to taste. Return steaks and mushrooms to the pan, spooning sauce over the top. Once just heated through, plate immediately. Garnish with fresh thyme.", time: "3 min" },
    ]
  },

  "dutch oven pot roast": {
    id: "pot-roast", section: "beef", servings: 6,
    ingredients: [
      { group: "Roast", items: [
        { amount: "3–4 lbs", name: "Beef chuck roast" },
        { amount: "2 Tbsp", name: "Olive oil" },
        { amount: "to taste", name: "Kosher salt & black pepper" },
      ]},
      { group: "Aromatics & Vegetables", items: [
        { amount: "2 large", name: "Yellow onions, cut into thick slices" },
        { amount: "6 cloves", name: "Garlic, minced" },
        { amount: "3 large", name: "Carrots, cut into 2-inch pieces" },
        { amount: "3 large", name: "Yukon Gold potatoes, quartered" },
        { amount: "3 ribs", name: "Celery, cut into 2-inch pieces" },
      ]},
      { group: "Braising Liquid", items: [
        { amount: "2 Tbsp", name: "Tomato paste" },
        { amount: "½ cup", name: "Dry red wine" },
        { amount: "1½ cups", name: "Beef broth" },
        { amount: "1 Tbsp", name: "Worcestershire sauce" },
        { amount: "3 sprigs", name: "Fresh thyme" },
        { amount: "2 sprigs", name: "Fresh rosemary" },
        { amount: "2", name: "Bay leaves" },
      ]},
    ],
    steps: [
      { num: 1, title: "Season & preheat", text: "Preheat oven to 300°F. Pat chuck roast completely dry and season every surface aggressively with salt and pepper. Don't hold back — a thick roast needs more seasoning than you think." },
      { num: 2, title: "Deep sear", text: "Heat olive oil in a large Dutch oven over medium-high until shimmering. Sear roast 4–5 minutes per side on all surfaces, including the ends, until deeply browned. This isn't just about color — it builds the foundation of the entire braise. Remove to a plate.", time: "12–15 min" },
      { num: 3, title: "Caramelize the base", text: "In the same pot, add onions. Cook 5–7 minutes until golden at the edges. Add garlic and tomato paste, stirring constantly for 2 minutes until the paste darkens and smells sweet. Darkening the paste removes bitterness and adds depth.", time: "8 min" },
      { num: 4, title: "Deglaze", text: "Pour in red wine and scrape every bit from the bottom — those fond particles dissolve into the sauce. Simmer 2–3 minutes. Add beef broth and Worcestershire.", time: "3 min" },
      { num: 5, title: "Braise low & slow", text: "Return roast to the pot with carrots, potatoes, celery, thyme, rosemary, and bay leaves. Liquid should reach halfway up the roast; add a splash more broth if needed. Bring to a simmer, cover tightly, and transfer to oven. Cook undisturbed.", time: "3–3½ hours" },
      { num: 6, title: "Rest & serve", text: "The roast is done when it pulls apart effortlessly with two forks. Remove herbs. Taste the braising liquid and season to taste — it's your sauce. Shred or slice and serve over vegetables, spooning pan juices generously over everything." },
    ]
  },

    steps: [
      { num: 1, title: "Sear the ribs", text: "Preheat oven to 275°F. Season short ribs generously. Heat oil in a large Dutch oven over medium-high. Working in batches to avoid crowding, sear 6–8 minutes per batch until deeply browned on all sides. Crowding steams the meat — take your time. Transfer to a plate.", time: "20–25 min" },
      { num: 2, title: "Build the aromatic base", text: "In the same pot, place garlic cut-side down. Cook 1–2 minutes until golden. Add onion, celery, and carrots. Season, and cook 5–10 minutes until softened and beginning to caramelize. Add tomato paste and stir constantly 2–3 minutes until it darkens to a brick red.", time: "15 min" },
      { num: 3, title: "Deglaze & build the braise", text: "Add red wine, scraping up every browned bit. Simmer 2–3 minutes. Add beef stock and thyme. Nestle short ribs back in the pot bone-side up — this position keeps the meat submerged and self-basting. Add more stock if needed to mostly submerge the ribs.", time: "5 min" },
      { num: 4, title: "Braise", text: "Bring to a simmer. Cover and transfer to oven. Cook undisturbed — the low, even heat of the oven produces a gentler, more consistent braise than the stovetop.", time: "3½–4 hours" },
      { num: 5, title: "Rest & finish", text: "Transfer ribs carefully to a platter — the meat will be very tender. Strain braising liquid through a fine mesh sieve and skim any fat from the surface. Season sauce to taste. Scatter parsley, chives, and lemon zest over the ribs and serve with sauce alongside." },

  },

  "reverse-seared ribeye": {

        { amount: "to taste", name: "Fresh cracked black pepper" },
      ]},

    steps: [
      { num: 1, title: "Dry brine the night before", text: "Salt steak generously on all sides — don't be shy. Place uncovered on a wire rack in the fridge. The salt draws moisture to the surface, then it reabsorbs, seasoning the meat deeply. A 24-hour brine produces the best crust when seared.", time: "8–24 hours ahead" },
      { num: 2, title: "Bring to temp & bake", text: "Pull steak from fridge 30 minutes before cooking. Preheat oven to 200°F. Place on a rack over a sheet pan and bake until internal temp reaches 110–115°F for medium-rare. The low oven ensures perfectly edge-to-edge even cooking.", time: "45–75 min" },
      { num: 3, title: "Rest before searing", text: "Remove from oven. Rest on the counter while the pan heats up. The surface needs to be dry — pat with a paper towel if needed.", time: "10 min" },
      { num: 4, title: "Ripping-hot sear", text: "Heat a cast iron or steel pan over medium-high for 2–3 minutes until very hot. Add avocado oil — it should shimmer immediately. Lay steak down and do not touch it. Sear 60–90 seconds per side. Add butter, herbs, and garlic if using, tilting pan to baste.", time: "3–4 min" },
      { num: 5, title: "Render fat cap & rest", text: "Hold steak upright with tongs against the hot pan to render the fat cap 20–30 seconds. Pull at 125°F for medium-rare. Rest on a cutting board 5–8 minutes — resting lets the juices redistribute instead of running out when you cut.", time: "5–8 min" },

      { num: 2, title: "Toast buns", text: "Butter cut sides of buns and toast on the griddle over medium until deeply golden. Set aside.", time: "2 min" },

      { num: 5, title: "Build & serve", text: "Sauce on the bottom bun. Stack pickles, lettuce, tomato, onion. Add the double patty and top bun. Serve immediately — smashburgers are best eaten the moment they come off the griddle." },

  "mike's hot honey garlic roasted chicken thighs": {
    id: "hot-honey-chicken", section: "chicken", servings: 4,
    ingredients: [
      { group: "Chicken", items: [
        { amount: "4 lbs", name: "Bone-in skin-on chicken thighs" },
        { amount: "1 tsp", name: "Smoked paprika" },
        { amount: "1 tsp", name: "Garlic powder" },
        { amount: "1 tsp", name: "Onion powder" },
        { amount: "to taste", name: "Kosher salt & black pepper" },
      ]},
      { group: "Hot Honey Glaze", items: [
        { amount: "3 Tbsp", name: "Mike's Hot Honey" },
        { amount: "4 cloves", name: "Garlic, minced" },
        { amount: "2 Tbsp", name: "Soy sauce (or tamari for GF)" },
        { amount: "1 Tbsp", name: "Unsalted butter" },
        { amount: "1 tsp", name: "Rice vinegar or apple cider vinegar" },
      ]},
    ],
    steps: [
      { num: 1, title: "Dry brine", text: "Pat thighs completely dry with paper towels — moisture is the enemy of crispy skin. Season on all sides with salt, pepper, paprika, garlic powder, and onion powder. Rest uncovered on a rack in the fridge for at least 30 minutes, or overnight for dramatically better skin.", time: "30 min – overnight" },
      { num: 2, title: "Sear skin-side down", text: "Pull chicken from fridge 20–30 minutes before cooking. Heat a cast iron skillet over medium — not high, which burns before crisping. Add thighs skin-side down in a dry pan. Press gently and cook undisturbed 7–8 minutes until the skin is deep golden and releases cleanly. Flip and sear the flesh side 2 more minutes.", time: "9–10 min" },
      { num: 3, title: "Roast", text: "Transfer skillet to a 425°F oven skin-side up. Roast 20–25 minutes until internal temperature at the thickest point reaches 190–195°F. Thighs benefit from higher temp than breast — the collagen breaks down and the meat becomes silky rather than dry.", time: "20–25 min" },
      { num: 4, title: "Make the glaze", text: "Melt butter in a small saucepan over medium-low. Add garlic, cook 1–2 minutes until fragrant. Add honey, soy sauce, and vinegar. Simmer 4–5 minutes until slightly thickened and coating a spoon.", time: "6–8 min" },
      { num: 5, title: "Glaze & finish", text: "With 5–7 minutes left in the oven, pull the skillet and brush glaze generously over the skin. Return to oven. Watch closely — honey caramelizes fast and can go from lacquered to burnt in under a minute. Rest 5–10 minutes before serving.", time: "5–10 min" },
    ]
  },

  "spatchcock chicken with homemade herb sauce": {
    id: "spatchcock", section: "chicken", servings: 4,
    ingredients: [
      { group: "Chicken & Rub", items: [

        { amount: "1½ Tbsp", name: "Kosher salt" },
        { amount: "1 Tbsp", name: "Brown sugar" },
        { amount: "1 Tbsp", name: "Paprika" },
        { amount: "1 Tbsp", name: "Garlic powder" },
        { amount: "1 tsp", name: "Black pepper" },
        { amount: "2 Tbsp", name: "Olive oil" },
      ]},
      { group: "Herb Sauce", items: [
        { amount: "¾ cup", name: "Mayonnaise" },
        { amount: "10 leaves", name: "Fresh basil" },
        { amount: "⅓ cup", name: "Fresh cilantro, packed" },
        { amount: "4", name: "Green onions, roughly chopped" },
        { amount: "6 cloves", name: "Garlic" },
        { amount: "2 Tbsp", name: "Fresh lemon juice" },
        { amount: "to taste", name: "Salt & pepper" },
      ]},
    ],
    steps: [
      { num: 1, title: "Spatchcock the chicken", text: "Place chicken breast-side down. Using sturdy kitchen shears, cut along both sides of the backbone from tail to neck and remove it (save it for stock). Flip breast-side up and press firmly on the breastbone with both palms until you hear a crack and the bird lays completely flat. This opens the chicken so every part hits the grill simultaneously." },
      { num: 2, title: "Dry brine & season", text: "Mix salt, brown sugar, paprika, garlic powder, and pepper. Pat chicken dry and rub with olive oil, then coat every surface with the spice rub — get under the skin too. For best results, refrigerate uncovered on a rack for at least 2 hours or overnight. The brine pulls moisture out, then it reabsorbs, seasoning the meat from within.", time: "2+ hours" },
      { num: 3, title: "Make the herb sauce", text: "Blend or food-process the basil, cilantro, green onions, garlic, and lemon juice until finely chopped. Fold into the mayonnaise and season to taste. Refrigerate until serving — the flavors deepen as it sits." },
      { num: 4, title: "Grill", text: "Heat grill to medium-high (350–400°F). Oil the grates. Place chicken skin-side down over direct heat. Grill 5 minutes until skin is crispy and charred. Reduce heat to low (250–300°F), flip, and continue grilling until the thickest part of the thigh reads 165°F.", time: "40–50 min" },
      { num: 5, title: "Rest & serve", text: "Rest on a cutting board 10 minutes before carving. The rest allows juices to redistribute — cutting immediately loses a third of the moisture. Serve family-style with herb sauce alongside.", time: "10 min" },
    ]
  },

    steps: [

  },

        { amount: "1 tsp", name: "Black pepper" },
        { amount: "to taste", name: "Kosher salt" },
      ]},

    steps: [
      { num: 1, title: "Make the marinade", text: "Whisk all marinade ingredients together until the brown sugar fully dissolves. The formula here is balanced: fat for moisture, acid to tenderize, salt for depth, sugar for caramelization." },
      { num: 2, title: "Marinate", text: "Place chicken in a zip-lock bag. Use a fork to poke small holes all over — this helps the marinade penetrate past the surface. Pour marinade over, seal, and refrigerate. Minimum 30 minutes; overnight is best for maximum flavor.", time: "30 min – overnight" },
      { num: 3, title: "Grill", text: "Remove chicken from marinade and let excess drip off — too much marinade on the grill causes flare-ups. Grill over medium-high, 5–6 minutes per side for breasts, 6–7 minutes per side for thighs, until internal temperature reaches 165°F.", time: "10–14 min" },
      { num: 4, title: "Rest & serve", text: "Transfer to a cutting board and rest 5 minutes before slicing. Resting lets internal juices settle back into the muscle fibers instead of running out when you cut.", time: "5 min" },

  },

      { num: 2, title: "Air fryer method", text: "Preheat air fryer to 380°F. Remove chicken, letting excess marinade drip off. Cook in a single layer 18–22 minutes, flipping halfway, until internal temp hits 165°F. The circulating air crisps the edges in a way the oven can't match.", time: "18–22 min" },

        { amount: "8 cloves", name: "Garlic, smashed and peeled" },

        { amount: "1 Tbsp", name: "Olive oil" },

      { num: 2, title: "Flip & add garlic", text: "Flip thighs. Add butter and garlic cloves to the pan. Tilt the pan and spoon the foaming butter over the thighs continuously — this is basting, and it accelerates browning on the flesh side. Cook 2 minutes, watching the garlic closely so it turns golden but not dark brown.", time: "2 min" },
      { num: 3, title: "Finish in pan", text: "Add broth and herbs. Reduce heat to medium-low, cover, and cook 5–7 minutes until the thighs reach 165°F. The steam from the broth finishes the meat while keeping it moist.", time: "5–7 min" },

  // ── SEAFOOD ───────────────────────────────────────────────────────────────

        { amount: "¼ tsp", name: "Red pepper flakes (optional)" },
      ]},
    ],
    steps: [
      { num: 1, title: "Prep the fish", text: "Preheat air fryer to 375°F. Spray the basket lightly. Pat sea bass fillets completely dry with paper towels — this single step determines whether you get caramelization or steaming. Season both sides generously with salt and pepper.", time: "5 min" },
      { num: 2, title: "Air fry — first pass", text: "Place fillets skin-side down in the basket without overlapping. Air fry at 375°F for 10 minutes. Don't open the basket.", time: "10 min" },
      { num: 3, title: "Make the glaze", text: "While the fish cooks, stir honey, soy sauce, garlic, and red pepper flakes together until smooth. Have a brush ready." },
      { num: 4, title: "Glaze & finish", text: "After 10 minutes, brush glaze generously over the fish. Increase temperature to 400°F and cook 2 more minutes until the glaze caramelizes and the fish flakes cleanly when pressed with a fork. Honey burns fast at high heat — watch closely.", time: "2 min" },
      { num: 5, title: "Rest & serve", text: "Rest 2 minutes before plating. Sea bass is rich and buttery — it pairs best with something acidic alongside, like cucumber salad or a squeeze of fresh lemon.", time: "2 min" },

  },

    steps: [

      { num: 3, title: "Cook the shrimp", text: "Add shrimp in a single layer — do not crowd the pan or they'll steam. Cook 1½–2 minutes per side until the spice crust is deeply charred and the shrimp is just opaque throughout. Shrimp cook in under 4 minutes total; pull them the moment they're done.", time: "3–4 min" },
      { num: 4, title: "Finish", text: "Reduce heat to medium. Add butter and garlic. Toss shrimp in the garlic butter for 30 seconds. Squeeze lemon juice over the top to cut through the richness. Plate immediately — shrimp don't hold well.", time: "1 min" },
    ]
  },

  "old bay shrimp boil": {

    ingredients: [

        { amount: "3 ears", name: "Corn, cut into thirds" },
        { amount: "12 oz", name: "Smoked andouille or kielbasa, sliced" },
        { amount: "1½ lbs", name: "Large shrimp, shell-on or peeled & deveined" },
        { amount: "⅓ cup", name: "Old Bay seasoning" },

      { num: 2, title: "Cook potatoes", text: "Add potatoes to the boiling broth. Cook 10–12 minutes until nearly tender — they should still have slight resistance since they'll carry over-cook later.", time: "10–12 min" },

  // ── SIDES ─────────────────────────────────────────────────────────────────

    steps: [
      { num: 1, title: "Peel, cut & boil", text: "Peel potatoes and cut into uniform ¾-inch pieces — consistent sizing ensures even cooking. Place in a pot of cold salted water (cold water heats with the potato for more even cooking than dropping pieces into boiling water). Bring to a boil, then reduce to a steady simmer. Cook 15–20 minutes until a fork slides in with zero resistance.", time: "20 min" },

// ─── SHEET DATA & STATE ───────────────────────────────────────────────────────
let RECIPES = [];
let activeDiets = new Set();
let currentRecipeId = null;
let currentServings = 4;

// ─── CSV PARSER ───────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = splitLine(lines[0]).map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = splitLine(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim(); });
    return obj;
  }).filter(r => Object.values(r).some(v => v));
}

function splitLine(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { q = !q; }
    else if (line[i] === ',' && !q) { out.push(cur); cur = ''; }
    else { cur += line[i]; }
  }
  out.push(cur);
  return out;
}

function get(row, ...keys) {
  for (const k of keys) if (row[k] !== undefined && row[k] !== '') return row[k];
  return null;
}

function toBool(v) {
  if (!v) return false;
  return ['TRUE','YES','1','X'].includes(v.toString().toUpperCase().trim());
}

function normalizeRow(row) {
  const name = (get(row,'name','Name','Recipe Name','recipe_name','RECIPE NAME') || '').trim();
  if (!name) return null;
  const key = name.toLowerCase().trim();
  const w = WRITTEN[key] || {};
  const id = w.id || key.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return {
    id, name,
    chef: get(row,'chef','Chef','Author','author','By') || 'Houska',
    rating: parseFloat(get(row,'rating','Rating','Stars','stars')) || null,
    category: get(row,'category','Category','Type','type','Course') || 'Main',
    prep: parseInt(get(row,'prep','Prep','prep_time','Prep Time','Prep (min)','Prep (mins)')) || 0,
    cook: parseInt(get(row,'cook','Cook','cook_time','Cook Time','Cook (min)','Cook (mins)')) || 0,
    total: parseInt(get(row,'total','Total','total_time','Total Time','Total (min)','Total (mins)')) || 0,
    gf: toBool(get(row,'gf','GF','gluten_free','Gluten Free','Gluten-Free')),
    df: toBool(get(row,'df','DF','dairy_free','Dairy Free','Dairy-Free')),
    notes: get(row,'notes','Notes','note','Note','Comments') || w.notes || null,
    sourceUrl: get(row,'sourceUrl','sourceurl','source_url','Source URL','URL','url','Link','link','Source') || w.sourceUrl || null,
    section: w.section || w.subcat || (
      (get(row,'category','Category','Type','type','Course') || '').toLowerCase().includes('dessert') ? 'desserts' : 'sides'
    ),
    servings: w.servings || 4,
    ingredients: w.ingredients || null,
    steps: w.steps || null,
  };
}

function formatTime(m) {
  if (!m) return '—';
  if (m < 60) return `${m}m`;
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

// ─── SERVING SCALER ───────────────────────────────────────────────────────────
function scaleAmount(raw, mult) {
  if (mult === 1) return raw;
  const noScale = /^(to taste|to garnish|to serve|pinch|glug|liberal|few dashes|cooking spray|as needed)/i;
  if (noScale.test(raw.trim())) return raw;
  const fracMap = {'½':0.5,'⅓':1/3,'⅔':2/3,'¼':0.25,'¾':0.75,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};
  let n = raw;
  for (const [s,v] of Object.entries(fracMap)) n = n.replace(s, ` ${v}`);
  n = n.replace(/(\d+)\s+(\d+)\/(\d+)/, (_,w,a,b) => String(+w + +a/+b));
  n = n.replace(/(\d+)\s+(0\.\d+)/, (_,w,f) => String(+w + +f));
  n = n.replace(/^(\d+)\/(\d+)/, (_,a,b) => String(+a/+b));
  const m = n.match(/^([\d.]+)(.*)/);
  if (!m) return raw;
  const scaled = parseFloat(m[1]) * mult;
  const rest = m[2];
  function fmt(x) {
    if (x === Math.round(x)) return String(Math.round(x));
    const nice = [[0.125,'⅛'],[0.25,'¼'],[0.333,'⅓'],[0.375,'⅜'],[0.5,'½'],[0.625,'⅝'],[0.667,'⅔'],[0.75,'¾'],[0.875,'⅞']];
    const w2 = Math.floor(x), f = x - w2;
    for (const [val,sym] of nice) if (Math.abs(f-val) < 0.04) return w2 > 0 ? `${w2}${sym}` : sym;
    return String(Math.round(x*10)/10);
  }
  return fmt(scaled) + rest;
}

function renderIngredientsHTML(recipe, mult) {
  let h = `<div class="recipe-col-title">Ingredients</div>`;
  h += `<div class="serving-adjuster">
    <span class="serving-label">Serves</span>
    <button class="serving-btn" onclick="adjustServings(-1)">−</button>
    <span id="serving-count">${currentServings}</span>
    <button class="serving-btn" onclick="adjustServings(1)">+</button>
  </div>
  <div id="ingredients-inner">`;
  for (const g of recipe.ingredients) {
    if (g.group) h += `<div class="ingredient-group-title">${g.group}</div>`;
    for (const item of g.items) {
      h += `<div class="ingredient-row"><span class="ingredient-amount">${scaleAmount(item.amount, mult)}</span><span class="ingredient-name">${item.name}</span></div>`;
    }
  }
  h += '</div>';
  return h;
}

function adjustServings(delta) {
  const r = RECIPES.find(x => x.id === currentRecipeId);
  if (!r || !r.servings || !r.ingredients) return;
  currentServings = Math.max(1, currentServings + delta);
  const mult = currentServings / r.servings;
  document.getElementById('serving-count').textContent = currentServings;
  let inner = '';
  for (const g of r.ingredients) {
    if (g.group) inner += `<div class="ingredient-group-title">${g.group}</div>`;
    for (const item of g.items) {
      inner += `<div class="ingredient-row"><span class="ingredient-amount">${scaleAmount(item.amount, mult)}</span><span class="ingredient-name">${item.name}</span></div>`;
    }
  }
  document.getElementById('ingredients-inner').innerHTML = inner;
}

// ─── FILTERS ──────────────────────────────────────────────────────────────────
function toggleDiet(diet) {
  activeDiets.has(diet) ? activeDiets.delete(diet) : activeDiets.add(diet);
  document.getElementById('btn-gf').classList.toggle('active', activeDiets.has('gf'));
  document.getElementById('btn-df').classList.toggle('active', activeDiets.has('df'));
  filterTOC();
}

function filterTOC() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('.toc-entry').forEach(el => {
    const r = RECIPES.find(x => x.id === el.dataset.id);
    if (!r) return;
    if (activeDiets.has('gf') && !r.gf) { el.classList.add('hidden'); return; }
    if (activeDiets.has('df') && !r.df) { el.classList.add('hidden'); return; }
    if (q) {
      const hay = [r.name, r.chef, r.notes||'', r.section].join(' ').toLowerCase();
      if (!hay.includes(q)) { el.classList.add('hidden'); return; }
    }
    el.classList.remove('hidden');
    visible++;
  });
  // Show/hide section headers based on whether they have visible entries
  document.querySelectorAll('.toc-subsection').forEach(sub => {
    const anyVisible = [...sub.querySelectorAll('.toc-entry')].some(e => !e.classList.contains('hidden'));
    sub.style.display = anyVisible ? '' : 'none';
  });
  document.querySelectorAll('.toc-section').forEach(sec => {
    const anyVisible = [...sec.querySelectorAll('.toc-entry')].some(e => !e.classList.contains('hidden'));
    sec.style.display = anyVisible ? '' : 'none';
  });
  document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
}

// ─── TOC RENDERER ─────────────────────────────────────────────────────────────
function buildTOC() {
  const tocBody = document.getElementById('toc-body');
  const parents = ['Mains', 'Sides & Salads', 'Desserts'];
  function normalizeKey(k) { return k === 'seafood' ? 'fish' : k; }
  const SECTIONS_D = [
    { key: 'beef',     label: 'Beef',          parent: 'Mains' },
    { key: 'chicken',  label: 'Chicken',       parent: 'Mains' },
    { key: 'fish',     label: 'Fish & Seafood',parent: 'Mains' },
    { key: 'sides',    label: 'Sides & Salads',parent: 'Sides & Salads' },
    { key: 'desserts', label: 'Desserts',      parent: 'Desserts' },
  ];
  let html = '';
  for (const parent of parents) {
    const sections = SECTIONS_D.filter(s => s.parent === parent);
    let parentHTML = '';
    for (const sec of sections) {
      const recipes = RECIPES.filter(r => normalizeKey(r.section) === sec.key);
      if (!recipes.length) continue;
      let entriesHTML = '';
      for (const r of recipes) {
        entriesHTML += `
          <div class="toc-entry" data-id="${r.id}" onclick="openRecipe('${r.id}')">
            <span class="toc-entry-name">${r.name}</span>
            <span class="toc-dots"></span>
            <span class="toc-meta">
              ${r.total ? `<span class="toc-time">${formatTime(r.total)}</span>` : ''}
              ${r.gf ? '<span class="toc-badge toc-gf">GF</span>' : ''}
              ${r.df ? '<span class="toc-badge toc-df">DF</span>' : ''}
            </span>
          </div>`;
      }
      parentHTML += `
        <div class="toc-subsection">
          <div class="toc-subsection-title">${sec.label}</div>
          ${entriesHTML}
        </div>`;
    }
    if (!parentHTML) continue;
    html += `
      <div class="toc-section">
        <div class="toc-section-title">${parent}</div>
        ${parentHTML}
      </div>`;
  }
  tocBody.innerHTML = html;
  document.getElementById('footer-count').textContent = `${RECIPES.length} recipes`;
}

function openRecipe(id) {
  const r = RECIPES.find(x => x.id === id);
  if (!r) return;
  currentRecipeId = id;
  currentServings = r.servings || 4;

  document.getElementById('toc').style.display = 'none';
  const page = document.getElementById('recipe-page');
  page.classList.add('active');

  // Section label
  const sec = SECTIONS.find(s => s.key === r.section);
  document.getElementById('r-section').textContent = sec
    ? (sec.parent === 'Mains' ? `Mains — ${sec.label}` : sec.parent)
    : 'Recipe';

  document.getElementById('r-title').textContent = r.name;

  // Meta row
  const metaItems = [
    { label: 'Chef', value: r.chef || 'Houska' },
    r.rating ? { label: 'Rating', value: `★ ${r.rating}` } : null,
    r.prep ? { label: 'Prep', value: formatTime(r.prep) } : null,
    r.cook ? { label: 'Cook', value: formatTime(r.cook) } : null,
    r.total ? { label: 'Total', value: formatTime(r.total) } : null,
    r.servings ? { label: 'Serves', value: r.servings } : null,
  ].filter(Boolean);

  document.getElementById('r-meta').innerHTML = metaItems.map(m => `
    <div class="recipe-meta-item">
      <span class="recipe-meta-label">${m.label}</span>
      <span class="recipe-meta-value">${m.value}</span>
    </div>`).join('');

  // Badges
  const badges = [];
  if (r.gf) badges.push('<span class="recipe-badge badge-gf">Gluten-Free</span>');
  if (r.df) badges.push('<span class="recipe-badge badge-df">Dairy-Free</span>');
  document.getElementById('r-badges').innerHTML = badges.join('');

  // Note
  const noteEl = document.getElementById('r-note');
  if (r.notes) { noteEl.textContent = r.notes; noteEl.style.display = 'block'; }
  else { noteEl.style.display = 'none'; }

  // Body
  let left = '', right = '';

  if (r.ingredients) {
    left = renderIngredientsHTML(r, 1);
  }

  if (r.steps) {
    right = `<div class="recipe-col-title">Instructions</div><div class="steps-list">`;
    for (const s of r.steps) {
      right += `<div class="step">
        <div class="step-num">${s.num}</div>
        <div class="step-content">
          <div class="step-title">${s.title}</div>
          <div class="step-text">${s.text}</div>
          ${s.tip ? `<div class="step-tip">💡 ${s.tip}</div>` : ''}
          ${s.time ? `<div class="step-time">⏱ ${s.time}</div>` : ''}
        </div>
      </div>`;
    }
    right += '</div>';
  }

  if (!r.ingredients && !r.steps && r.sourceUrl) {
    left = `<a href="${r.sourceUrl}" target="_blank" rel="noopener" class="source-link">Open Full Recipe ↗</a>`;
  }

  document.getElementById('r-body').innerHTML = `
    <div id="ingredients-col">${left}</div>
    <div id="steps-col">${right}</div>`;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closePage() {
  document.getElementById('recipe-page').classList.remove('active');
  document.getElementById('toc').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── SHEET LOADER ─────────────────────────────────────────────────────────────
async function loadFromSheet() {
  document.getElementById('toc-body').innerHTML = `
    <div class="no-results" style="display:block;opacity:0.5">
      <p style="font-family:'Playfair Display',serif">Opening the book…</p>
    </div>`;
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const rows = parseCSV(text);
    if (!rows.length) throw new Error('Sheet appears empty');
    RECIPES = rows.map(normalizeRow).filter(Boolean);
    if (!RECIPES.length) throw new Error('Could not read recipes — check column headers');
    buildTOC();
  } catch (err) {
    document.getElementById('toc-body').innerHTML = `
      <div class="no-results" style="display:block;opacity:1">
        <p style="color:var(--rust);font-family:'Playfair Display',serif">Could not load recipes</p>
        <p style="font-size:0.78rem;margin-top:0.4rem">${err.message}</p>
        <p style="font-size:0.72rem;margin-top:0.75rem;opacity:0.5">File → Share → Publish to web → CSV in Google Sheets</p>
      </div>`;
  }
}

loadFromSheet();
</script>
